<style>
.sec {
  margin: 14px 0 4px;
  font-weight: 700;
  font-size: 15px;
}
.two {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 10px;
}
.full {
  grid-column: 1 / -1;
}
.lrow {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
  gap: 6px;
  align-items: end;
  margin: 6px 0;
}
.lrow button {
  min-height: 44px;
}
.checks label {
  display: flex;
  gap: 8px;
  align-items: center;
  font-size: 14px;
  padding: 6px 0;
  color: var(--ink);
  font-weight: 400;
}
.checks input {
  width: 22px;
  height: 22px;
}
.cut {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 8px;
}
.result b {
  font-size: 18px;
}
.bar {
  position: sticky;
  bottom: 0;
  background: var(--bg);
  padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  margin-top: 14px;
  z-index: 10;
}
@media (max-width: 420px) {
  .lrow {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
}
</style>
<link rel="stylesheet" href="kk.css"><script src="tap.js" defer></script><script src="kk-base.js"></script>
</head>
<body data-page="farm"><main class="app">
<header id="kh"></header>
<div id="view"></div>
<div id="kf"></div>
</main>
<script src="koko.js"></script><script src="koko-data.js"></script><script src="sync.js"></script><script src="origin-db.js"></script><script src="sharecard.js"></script><script src="kk-photos.js"></script><script src="kk-crew.js"></script><script src="qrcode.js"></script><script src="kk-units.js" defer></script>
<script>
// Farm records: farms, blocks, pod harvests, fermentation and drying runs, dry bean lots.
// Stored on this device (KokoRecords); when signed in, synced to your Koko account.
const $ = s => document.querySelector(s);
const TABS = [
  ['estate', 'farms', 'Farms', 'Farm'],
  ['plot', 'blocks', 'Blocks', 'Block'],
  ['harvest', 'harvests', 'Pod harvests', 'Pod harvest'],
  ['process', 'runs', 'Fermentation', 'Fermentation and drying'],
  ['green', 'lots', 'Dry bean lots', 'Dry bean lot'],
];
const tabOf = t => TABS.find(x => x[0] === t);
const SHADE = [
  'Under coconut',
  'Under arecanut',
  'Forest or tree shade',
  'Banana or temporary shade',
  'Open',
  'Mixed',
];
const PRECOND = [
  'None',
  'Pods stored before opening',
  'Some pulp drained or pressed',
  'Beans spread before boxing',
];
const FIELDS = {
  estate: [
    ['name', 'Farm name', 'text', { req: 1, ph: 'Thumpassery Estate' }],
    ['locality', 'Place', 'text', { ph: 'Village or town' }],
    ['district', 'District', 'text'],
    ['state', 'State or region', 'text', { ph: 'Kerala' }],
    ['country', 'Country', 'text', { ph: 'India' }],
    ['area', 'Area', 'num'],
    ['areaUnit', 'Area unit', 'select', { opts: ['acre', 'ha', 'cent'] }],
    ['altitude', 'Height above sea, m', 'num'],
    ['geo', 'Location', 'geo'],
    ['notes', 'Notes', 'area'],
  ],
  plot: [
    ['estateId', 'Farm', 'link', { type: 'estate', req: 1 }],
    ['name', 'Block name', 'text', { req: 1, ph: 'Block 3, near the stream' }],
    ['clone', 'Variety or clone', 'clone', { ph: 'CCRP 1, CCN-51, mixed seedlings' }],
    ['trees', 'Trees', 'num'],
    ['planted', 'Year planted', 'num'],
    ['spacing', 'Spacing', 'text', { ph: '3 × 3 m' }],
    ['shade', 'Shade', 'select', { opts: SHADE }],
    ['area', 'Area, acre', 'num'],
    ['geo', 'Location', 'geo'],
    ['notes', 'Notes', 'area'],
  ],
  harvest: [
    ['date', 'Picking date', 'date', { req: 1 }],
    ['plotIds', 'Blocks', 'links', { type: 'plot' }],
    ['pods', 'Pods picked', 'num'],
    ['blackPods', 'Black pod (rotten) pods', 'num'],
    ['damagedPods', 'Pods holed by squirrels or rats', 'num'],
    ['podDays', 'Days pods kept before opening', 'num'],
    ['wetKg', 'Wet beans, kg', 'num'],
    ['brix', 'Pulp Brix, °Bx', 'num'],
    ['notes', 'Notes', 'area'],
  ],
  process: [
    ['code', 'Run name or code', 'text', { req: 1, ph: 'F-12' }],
    ['harvestIds', 'From pod harvests', 'links', { type: 'harvest' }],
    ['sec', 'Fermentation'],
    ['protocol', 'Protocol', 'select', { opts: PROTOCOLS.map(x => x.name) }],
    ['method', 'Method', 'select', { opts: Object.keys(FERMENT_METHODS) }],
    ['vessel', 'Box or vessel', 'text', { ph: 'Box 2, teak' }],
    ['precond', 'Before fermenting', 'select', { opts: PRECOND }],
    ['starter', 'Starter yeast', 'select', { opts: ['None', ...Object.keys(STARTERS), 'Other'] }],
    ['starterG', 'Yeast added, g', 'num'],
    ['fruit', 'Fruit or pulp added', 'text', { ph: 'None, or what and how much' }],
    ['start', 'Started', 'datetime-local'],
    ['wetKg', 'Wet beans in, kg', 'num'],
    ['brix', 'Pulp Brix at start, °Bx', 'num'],
    ['ph', 'Pulp pH at start', 'num'],
    ['turns', 'Turns and temperatures', 'turns'],
    ['fermentEnd', 'Fermentation ended', 'datetime-local'],
    ['sec', 'Drying'],
    ['dryMethod', 'Drying method', 'select', { opts: DRY_METHODS }],
    ['dryStart', 'Drying started', 'date'],
    ['dryReads', 'Moisture readings', 'dryreads'],
    ['dryEnd', 'Drying ended', 'date'],
    ['dryKg', 'Dry beans out, kg', 'num'],
    ['notes', 'Notes', 'area'],
  ],
  green: [
    ['code', 'Lot code', 'text', { req: 1, ph: 'KK-C-01' }],
    ['name', 'Name', 'text', { ph: 'CCRP 1, box fermented' }],
    ['processId', 'From fermentation run', 'link', { type: 'process' }],
    ['date', 'Date', 'date'],
    ['weightKg', 'Weight, kg', 'num'],
    ['moisture', 'Moisture, %', 'num'],
    ['bags', 'Bags', 'num'],
    ['bagKg', 'Bag size, kg', 'num'],
    ['cut', 'Cut test', 'cut'],
    ['beans', 'Bean count', 'beans'],
    ['designations', 'Designations and claims', 'checks', { opts: DESIGNATIONS.map(x => x[0]) }],
    ['storage', 'Stored where', 'text'],
    ['notes', 'Notes', 'area'],
  ],
};
let DB = {},
  CUR = null,
  CUR_T = null;
async function load() {
  DB = await ORIGIN.allTypes(['estate', 'plot', 'harvest', 'process', 'green', 'batch']);
  for (const t in DB)
    DB[t].sort((a, b) =>
      String(b.date || b.start || b.createdAt || '').localeCompare(
        String(a.date || a.start || a.createdAt || '')
      )
    );
}
const density = r => (+r.trees && +r.area ? Math.round(+r.trees / (+r.area * 0.404686)) : null);
const byId = (t, id) => (DB[t] || []).find(r => r.id === id);
function title(t, r) {
  if (!r) return '';
  if (t === 'estate') return r.name || 'Farm';
  if (t === 'plot')
    return (r.name || 'Block') + (byId('estate', r.estateId) ? ' · ' + byId('estate', r.estateId).name : '');
  if (t === 'harvest') return 'Picking ' + fmtDate(r.date);
  if (t === 'process') return 'Run ' + (r.code || '') + (r.start ? ' · ' + fmtDate(r.start) : '');
  if (t === 'green') return (r.code || 'Lot') + (r.name ? ' · ' + r.name : '');
  return r.name || '';
}
function facts(t, r) {
  const f = [];
  if (t === 'estate')
    f.push(
      [r.locality, r.district, r.state].filter(Boolean).join(', '),
      r.area ? r.area + ' ' + (r.areaUnit || 'acre') : ''
    );
  if (t === 'plot')
    f.push(
      r.clone,
      r.trees ? r.trees + ' trees' : '',
      density(r) ? density(r) + ' trees per ha' : '',
      r.shade
    );
  if (t === 'harvest')
    f.push(
      r.pods ? r.pods + ' pods' : '',
      r.wetKg ? r.wetKg + ' kg wet beans' : '',
      (r.plotIds || [])
        .map(id => (byId('plot', id) || {}).name)
        .filter(Boolean)
        .join(', ')
    );
  if (t === 'process') {
    const s = fermentSummary(r);
    f.push(
      r.protocol || r.method,
      s.fermentHours ? Math.round((s.fermentHours / 24) * 10) / 10 + ' days' : '',
      s.peak ? 'peak ' + s.peak + ' °C' : '',
      s.brixStart != null ? s.brixStart + ' °Bx' : '',
      s.moisture != null ? s.moisture + '% moisture' : '',
      r.dryKg ? r.dryKg + ' kg dry' : ''
    );
  }
  if (t === 'green')
    f.push(r.weightKg ? r.weightKg + ' kg' : '', r.moisture ? r.moisture + '% moisture' : '');
  return f.filter(Boolean).join(' · ');
}
function tags(t, r) {
  if (t !== 'green') return '';
  const c = cutTest(r.cut);
  const b = beanCount(r.per100, r.w300);
  return (
    (c
      ? ' <span class="tag ' +
        (c.grade === 'Grade I' ? 'ok' : c.grade === 'Grade II' ? 'wait' : 'bad') +
        '">' +
        c.grade +
        '</span>'
      : '') +
    (b ? ' <span class="tag">' + b.count + ' beans / 100 g</span>' : '') +
    (r.traceToken ? ' <span class="tag ok">Passport</span>' : '')
  );
}

// ---------- list ----------
function tabsHtml(t) {
  return (
    '<div class="tabs">' +
    TABS.map(x => '<a href="#' + x[1] + '"' + (x[0] === t ? ' class="on"' : '') + '>' + x[2] + '</a>').join(
      ''
    ) +
    '</div>'
  );
}
const EMPTY = {
  estate: "Start here: add your farm. Then its blocks, then each day's picking.",
  plot: 'A block holds the trees: clone or variety, number, age, spacing and shade.',
  harvest: 'Record each picking: blocks, pods, rotten pods and the wet bean weight.',
  process:
    'Start a run from one or more pickings: fermentation turns and temperatures, then drying and moisture.',
  green:
    'A dry bean lot is what you sell or make chocolate from. Add the cut test and bean count to see its grade.',
};
async function listView(t) {
  await load();
  const tb = tabOf(t);
  const rows = DB[t] || [];
  $('#view').innerHTML =
    '<h1>Farm</h1><div class="sub">From tree to dry bean. Kept on this phone; signed in, it syncs to your Koko account.</div>' +
    tabsHtml(t) +
    '<div class="row" style="margin:8px 0"><a class="btn cocoa" href="#new/' +
    t +
    '">＋ New ' +
    tb[3].toLowerCase() +
    '</a>' +
    (t === 'estate' || t === 'plot' ? '<a class="btn" href="map.html">Map of farm and blocks</a>' : '') +
    (rows.length
      ? '<button class="btn" id="csv">Export CSV</button><button class="btn" id="cards">Cards and PDF</button>'
      : '') +
    '</div>' +
    (rows.length
      ? rows
          .map(
            r =>
              '<div class="card"><a class="item" href="#edit/' +
              t +
              '/' +
              encodeURIComponent(r.id) +
              '"><b>' +
              esc(title(t, r)) +
              '</b>' +
              tags(t, r) +
              '<div class="mini">' +
              esc(facts(t, r)) +
              '</div></a></div>'
          )
          .join('')
      : '<div class="card mini">' + EMPTY[t] + '</div>') +
    (t === 'process'
      ? '<div class="guide">' +
        FERMENT_GUIDE +
        '<br><small>' +
        srcLink('ICCO') +
        ' · ' +
        srcLink('CPCRI') +
        '</small></div><div class="guide">' +
        DRY_NOTE +
        '<br><small>' +
        srcLink('REV') +
        '</small></div>'
      : '') +
    (t === 'green'
      ? '<div class="guide">' +
        DRY_GUIDE +
        '<br><small>' +
        srcLink('ICCO') +
        ' · ' +
        srcLink('ISO') +
        '</small></div>'
      : '');
}

// ---------- form ----------
function fieldHtml(t, f, r) {
  const [k, l, ty, o = {}] = f;
  const v = r[k] == null ? '' : r[k];
  const lab = l + (o.req ? ' *' : '');
  if (ty === 'sec' || k === 'sec') return '<div class="sec full">' + esc(l) + '</div>';
  if (ty === 'area')
    return '<label class="f full">' + lab + '<textarea data-k="' + k + '">' + esc(v) + '</textarea></label>';
  if (ty === 'select')
    return (
      '<label class="f">' +
      lab +
      '<select data-k="' +
      k +
      '"><option value=""></option>' +
      o.opts.map(x => '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>').join('') +
      '</select></label>'
    );
  if (ty === 'link') {
    const list = DB[o.type] || [];
    return (
      '<label class="f full">' +
      lab +
      '<select data-k="' +
      k +
      '"><option value="">' +
      (list.length ? 'Choose…' : 'None yet') +
      '</option>' +
      list
        .map(
          x =>
            '<option value="' +
            esc(x.id) +
            '"' +
            (x.id === v ? ' selected' : '') +
            '>' +
            esc(title(o.type, x)) +
            '</option>'
        )
        .join('') +
      '</select></label>'
    );
  }
  if (ty === 'checks') {
    const on = new Set(Array.isArray(v) ? v : []);
    return (
      '<div class="f full checks" data-checks="' +
      k +
      '"><div class="mini" style="font-weight:600">' +
      lab +
      '</div>' +
      o.opts
        .map(
          x =>
            '<label><input type="checkbox" value="' +
            esc(x) +
            '"' +
            (on.has(x) ? ' checked' : '') +
            '>' +
            esc(x) +
            '</label>'
        )
        .join('') +
      '<div class="mini" id="desigOut"></div></div>'
    );
  }
  if (ty === 'links') {
    const list = DB[o.type] || [],
      on = new Set(Array.isArray(v) ? v : []);
    return (
      '<div class="f full checks" data-links="' +
      k +
      '"><div class="mini" style="font-weight:600">' +
      lab +
      '</div>' +
      (list.length
        ? list
            .slice(0, 60)
            .map(
              x =>
                '<label><input type="checkbox" value="' +
                esc(x.id) +
                '"' +
                (on.has(x.id) ? ' checked' : '') +
                '>' +
                esc(title(o.type, x)) +
                '</label>'
            )
            .join('')
        : '<div class="mini">None yet.</div>') +
      '</div>'
    );
  }
  if (ty === 'clone')
    return (
      '<label class="f full">' +
      lab +
      '<input data-k="' +
      k +
      '" list="clones" value="' +
      esc(v) +
      '" placeholder="' +
      esc(o.ph || '') +
      '"><datalist id="clones">' +
      KOKO_CLONES.map(c => '<option value="' + esc(c[0]) + '">').join('') +
      '</datalist></label>'
    );
  if (ty === 'geo')
    return (
      '<div class="f full"><div class="mini" style="font-weight:600">' +
      lab +
      '</div><div class="row"><input data-k="lat" type="number" step="any" placeholder="Latitude" value="' +
      esc(r.lat ?? '') +
      '" style="flex:1"><input data-k="lng" type="number" step="any" placeholder="Longitude" value="' +
      esc(r.lng ?? '') +
      '" style="flex:1"><button class="btn small" type="button" id="here">◎ Here</button></div></div>'
    );
  if (ty === 'turns')
    return listEditor('turns', lab, r.turns, [
      ['at', 'Time', 'datetime-local'],
      ['temp', '°C', 'number'],
      ['brix', '°Bx', 'number'],
      ['ph', 'pH', 'number'],
      ['note', 'Note', 'text'],
    ]);
  if (ty === 'dryreads')
    return listEditor('dryReads', lab, r.dryReads, [
      ['date', 'Date', 'date'],
      ['moisture', '%', 'number'],
      ['note', 'Note', 'text'],
    ]);
  if (ty === 'cut') {
    const c = r.cut || {};
    return (
      '<div class="full"><div class="sec">Cut test</div><div class="mini">Cut 300 beans lengthwise (ISO 2451) and count each kind. A smaller sample works; the total is used.</div><div class="cut" style="margin-top:6px">' +
      CUT_KEYS.map(
        ([ck, cl]) =>
          '<label class="f">' +
          cl +
          '<input data-cut="' +
          ck +
          '" type="number" inputmode="numeric" value="' +
          esc(c[ck] ?? '') +
          '"></label>'
      ).join('') +
      '</div><div id="cutOut" class="card result" style="margin-top:8px"></div></div>'
    );
  }
  if (ty === 'beans')
    return (
      '<div class="full"><div class="sec">Bean count</div><div class="two"><label class="f">Beans in 100 g<input data-k="per100" type="number" inputmode="numeric" value="' +
      esc(r.per100 ?? '') +
      '"></label><label class="f">or weight of 300 beans, g<input data-k="w300" type="number" step="any" inputmode="decimal" value="' +
      esc(r.w300 ?? '') +
      '"></label></div><div id="beanOut" class="mini" style="margin-top:6px"></div></div>'
    );
  const type = ty === 'num' ? 'number' : ty;
  return (
    '<label class="f' +
    (ty === 'datetime-local' ? ' full' : '') +
    '">' +
    lab +
    '<input data-k="' +
    k +
    '" type="' +
    type +
    '"' +
    (ty === 'num' ? ' step="any" inputmode="decimal"' : '') +
    ' value="' +
    esc(v) +
    '" placeholder="' +
    esc(o.ph || '') +
    '"></label>'
  );
}
function listEditor(key, lab, rows, cols) {
  rows = Array.isArray(rows) && rows.length ? rows : [{}];
  return (
    '<div class="full" data-list="' +
    key +
    '"><div class="mini" style="font-weight:600">' +
    lab +
    '</div>' +
    rows.map(x => lrow(cols, x)).join('') +
    '<button type="button" class="btn small" data-add="' +
    key +
    '">＋ Add a row</button></div>'
  );
}
const COLS = {
  turns: [
    ['at', 'Time', 'datetime-local'],
    ['temp', '°C', 'number'],
    ['brix', '°Bx', 'number'],
    ['ph', 'pH', 'number'],
    ['note', 'Note', 'text'],
  ],
  dryReads: [
    ['date', 'Date', 'date'],
    ['moisture', '%', 'number'],
    ['note', 'Note', 'text'],
  ],
};
function lrow(cols, x) {
  return (
    '<div class="lrow">' +
    cols
      .map(
        ([c, l, ty]) =>
          '<label class="f">' +
          l +
          '<input data-c="' +
          c +
          '" type="' +
          ty +
          '"' +
          (ty === 'number' ? ' step="any" inputmode="decimal"' : '') +
          ' value="' +
          esc((x || {})[c] ?? '') +
          '"></label>'
      )
      .join('') +
    '<button type="button" class="btn small" data-del aria-label="Remove row">✕</button></div>'
  );
}
let PH = null; // the photos of the record being edited
function collect(t) {
  const r = { ...(CUR || {}), type: t };
  if (PH) r.photos = PH.photos;
  if (PH && (t === 'harvest' || t === 'process')) r.crew = PH.crew.filter(x => x.who || x.start);
  document.querySelectorAll('#form [data-k]').forEach(el => {
    const k = el.dataset.k;
    r[k] = el.type === 'number' ? (el.value === '' ? '' : +el.value) : el.value.trim();
  });
  document
    .querySelectorAll('#form [data-links]')
    .forEach(el => (r[el.dataset.links] = [...el.querySelectorAll('input:checked')].map(i => i.value)));
  document
    .querySelectorAll('#form [data-checks]')
    .forEach(el => (r[el.dataset.checks] = [...el.querySelectorAll('input:checked')].map(i => i.value)));
  document.querySelectorAll('#form [data-list]').forEach(el => {
    r[el.dataset.list] = [...el.querySelectorAll('.lrow')]
      .map(row => {
        const o = {};
        row
          .querySelectorAll('[data-c]')
          .forEach(i => (o[i.dataset.c] = i.type === 'number' ? (i.value === '' ? '' : +i.value) : i.value));
        return o;
      })
      .filter(o => Object.values(o).some(v => v !== '' && v != null));
  });
  if (document.querySelector('#form [data-cut]')) {
    r.cut = {};
    document
      .querySelectorAll('#form [data-cut]')
      .forEach(i => (r.cut[i.dataset.cut] = i.value === '' ? '' : +i.value));
  }
  return r;
}
function lineage(g) {
  const p = byId('process', g.processId);
  const hs = p ? (p.harvestIds || []).map(id => byId('harvest', id)).filter(Boolean) : [];
  const plots = [...new Set(hs.flatMap(h => h.plotIds || []))].map(id => byId('plot', id)).filter(Boolean);
  const estates = [...new Set(plots.map(x => x.estateId))].map(id => byId('estate', id)).filter(Boolean);
  return { p, hs, plots, estates };
}
function live() {
  if (CUR_T === 'green') {
    const r = collect('green');
    const L = lineage(r);
    const sel = DESIGNATIONS.filter(d => (r.designations || []).includes(d[0]));
    const eu = eudrCheck(L.plots);
    const single = L.estates.length === 1;
    $('#desigOut').innerHTML =
      sel
        .map(
          d =>
            '<div style="margin-top:6px"><b style="color:var(--ink)">' +
            esc(d[0]) +
            '.</b> ' +
            esc(d[1]) +
            (d[2] ? ' ' + srcLink(d[2]) : '') +
            (d[0] === 'Single estate' && !single
              ? ' <b style="color:var(--bad)">This lot links to ' + L.estates.length + ' farms.</b>'
              : '') +
            '</div>'
        )
        .join('') +
      '<div class="card" style="margin-top:8px"><b style="color:var(--ink)">EU deforestation rule</b><br>' +
      (eu.length
        ? eu
            .map(
              x =>
                (x.ok ? '✓ ' : '✗ ') +
                esc(x.name) +
                (x.ha != null ? ' (' + x.ha + ' ha)' : '') +
                ': needs a ' +
                (x.need === 'outline' ? 'drawn outline' : 'GPS point') +
                (x.ok ? '' : ', missing')
            )
            .join('<br>') +
          (eu.every(x => x.ok)
            ? '<br><b style="color:var(--ok)">Location ready for every block.</b> You still need proof of no clearing after 31 December 2020.'
            : '<br>Add the missing locations on the block or the map.')
        : 'Link the lot to a fermentation run to check its blocks.') +
      '<br><small>Each plot needs a GPS point; plots over 4 ha need an outline, six decimal places. Large operators apply the rule from 31 December 2026. ' +
      srcLink('EUDR') +
      '</small></div>';
    const c = cutTest(r.cut);
    $('#cutOut').innerHTML = c
      ? '<b>' +
        c.grade +
        '</b> · ' +
        c.ferm +
        '<div class="mini">' +
        c.n +
        ' beans: ' +
        c.pct.brown +
        '% fully brown, ' +
        c.pct.partly +
        '% partly, ' +
        c.pct.purple +
        '% purple, ' +
        c.pct.slaty +
        '% slaty, ' +
        c.pct.mouldy +
        '% mouldy, ' +
        c.other +
        '% insect, germinated or flat.</div><div class="mini" style="margin-top:4px">Grade I: at most 3% mouldy, 3% slaty and 3% insect, germinated or flat. Grade II: 4%, 8% and 6%. Good fermented: at most 5% slaty and 5% defective. ' +
        srcLink('ISO') +
        ' · ' +
        srcLink('NEPC') +
        '</div>'
      : '<span class="mini">Fill in the counts to see the grade.</span>';
    const b = beanCount(r.per100, r.w300);
    $('#beanOut').innerHTML = b
      ? '<b style="color:var(--ink)">' + b.count + ' beans per 100 g</b> · ' + b.cls + ' (ISO 2451)'
      : '';
  }
  if (CUR_T === 'plot') {
    const d = density(collect('plot'));
    $('#densOut').innerHTML = d
      ? '<b style="color:var(--ink)">' +
        d +
        " trees per hectare.</b> Recommended in Ghana and Indonesia: 1111; Côte d'Ivoire: 1333 (" +
        srcLink('REV') +
        '). Best spacing depends on the variety and the light.'
      : '';
  }
  if (CUR_T === 'process') {
    const pr = PROTOCOLS.find(x => x.name === $('[data-k="protocol"]').value);
    $('#protoGuide').innerHTML = pr
      ? '<b>' +
        esc(pr.name) +
        '</b> <span class="tag' +
        (pr.level === 'Standard' ? ' ok' : pr.level === 'Experimental' ? ' bad' : ' wait') +
        '">' +
        pr.level +
        '</span><ol style="margin:6px 0 0 18px;padding:0">' +
        pr.steps.map(x => '<li>' + esc(x) + '</li>').join('') +
        '</ol><small>' +
        srcLink(pr.src) +
        (pr.src === 'ESK' ? ' · ' + srcLink('PENA') : '') +
        '</small>'
      : '';
    const s = fermentSummary(collect('process'));
    const m = FERMENT_METHODS[$('[data-k="method"]').value];
    $('#runOut').innerHTML =
      [
        s.fermentHours != null
          ? 'Fermentation ' + s.fermentHours + ' h (' + Math.round(s.fermentHours / 2.4) / 10 + ' days)'
          : '',
        s.turns ? s.turns + ' turns' : '',
        s.peak ? 'peak ' + s.peak + ' °C' : '',
        s.dryDays != null ? 'drying ' + s.dryDays + ' days' : '',
        s.moisture != null
          ? 'last moisture ' +
            s.moisture +
            '%' +
            (s.moisture <= 7.5 ? ' (dry enough to export)' : s.moisture <= 8 ? ' (at the 8% limit)' : '')
          : '',
        s.recovery ? 'dry beans ' + s.recovery + '% of wet' : '',
        s.brixStart != null
          ? 'pulp ' + s.brixStart + ' °Bx' + (s.brixLast != null ? ' falling to ' + s.brixLast + ' °Bx' : '')
          : '',
      ]
        .filter(Boolean)
        .join(' · ') || 'Times, turns and moisture readings show a summary here.';
    const st = $('[data-k="starter"]').value,
      wet = +$('[data-k="wetKg"]').value;
    $('#starterGuide').innerHTML =
      st && st !== 'None'
        ? (STARTERS[st] ? '<b>' + st + '</b>: ' + STARTERS[st] + '<br>' : '') +
          STARTER_USE +
          (wet
            ? ' <b>For ' +
              wet +
              ' kg: ' +
              Math.round(wet * 2) +
              ' g yeast in ' +
              Math.round(wet * 20) / 1000 +
              ' L water.</b>'
            : '') +
          ' <small>' +
          srcLink('LAL') +
          '</small>'
        : '';
    $('#methodGuide').innerHTML =
      m && m.note
        ? '<b>' +
          esc($('[data-k="method"]').value) +
          '</b>: ' +
          [m.size, m.load, m.turn ? 'turn ' + m.turn : ''].filter(Boolean).join('; ') +
          '. ' +
          m.note +
          ' <small>' +
          srcLink(m.src) +
          '</small>'
        : '';
  }
}
async function editView(t, id) {
  await load();
  CUR_T = t;
  CUR = id ? byId(t, id) || null : null;
  if (id && !CUR) {
    $('#view').innerHTML =
      '<div class="card">Not found on this device. <a href="#' + tabOf(t)[1] + '">Back</a></div>';
    return;
  }
  const r =
    CUR ||
    (t === 'harvest' || t === 'green' ? { date: today() } : t === 'estate' ? { country: 'India' } : {});
  const tb = tabOf(t);
  let extra = '';
  if (t === 'plot')
    extra =
      '<div class="full mini" id="densOut"></div>' +
      (CUR
        ? '<div class="full"><a class="btn small" href="map.html#plot/' +
          encodeURIComponent(CUR.id) +
          '">' +
          (Array.isArray(CUR.geo) && CUR.geo.length > 2
            ? 'See outline on the map'
            : 'Draw its outline on the map') +
          '</a></div>'
        : '');
  if (t === 'process')
    extra =
      '<div class="guide full" id="protoGuide"></div><div class="guide full" id="starterGuide"></div><div class="guide full" id="methodGuide"></div><div class="card full mini" id="runOut"></div>';
  if (t === 'green' && CUR) {
    const L = lineage(CUR);
    const batches = (DB.batch || []).filter(b => b.lotId === CUR.id);
    extra =
      '<div class="card full"><b>Where it came from</b><div class="mini">' +
      (L.p ? 'Run ' + esc(L.p.code || '') + ' · ' : '') +
      (L.hs.length ? L.hs.length + ' picking' + (L.hs.length > 1 ? 's' : '') + ' · ' : '') +
      (L.plots.map(p => esc(p.name)).join(', ') ||
        'Link it to a fermentation run to show its blocks and farm.') +
      (L.estates.length ? ' · ' + L.estates.map(e => esc(e.name)).join(', ') : '') +
      (batches.length
        ? '<br>' + batches.length + ' chocolate batch' + (batches.length > 1 ? 'es' : '') + ' made from it.'
        : '') +
      '</div><div class="row" style="margin-top:8px"><button class="btn small cocoa" type="button" id="pass">Passport and QR</button><a class="btn small" href="map.html#green/' +
      encodeURIComponent(CUR.id) +
      '">Where it grew</a><a class="btn small" href="bar.html#new/' +
      encodeURIComponent(CUR.id) +
      '">Make a batch</a><a class="btn small" href="taste.html#new/' +
      encodeURIComponent(CUR.id) +
      '">Taste it</a></div></div>';
  }
  if (['plot', 'harvest', 'process'].includes(t) && CUR && CUR.id)
    extra +=
      '<div class="card full"><b>Lot passport</b><div class="mini">Seal this record and what led to it. A cocoa lot made from it later carries on the same passport.</div><div class="row" style="margin-top:8px"><button class="btn small cocoa" type="button" id="pass">' +
      (CUR.traceLot ? 'Seal changes' : 'Passport and QR') +
      '</button></div></div>';
  $('#view').innerHTML =
    '<a href="#' +
    tb[1] +
    '">‹ ' +
    tb[2] +
    '</a><h1>' +
    (CUR ? esc(title(t, CUR)) : 'New ' + tb[3].toLowerCase()) +
    '</h1>' +
    '<div class="two" id="form">' +
    FIELDS[t].map(f => fieldHtml(t, f, r)).join('') +
    extra +
    (t === 'harvest' || t === 'process'
      ? '<div class="full"><b>People and hours</b><div id="kkCrew"></div></div>'
      : '') +
    '<div class="full"><b>Photos</b><div id="kkPhotos"></div></div>' +
    '</div><div class="row bar"><button class="btn cocoa" id="save">Save</button><a class="btn" href="#' +
    tb[1] +
    '">Cancel</a>' +
    (CUR ? '<button class="btn" id="card">Image or PDF</button>' : '') +
    (CUR ? '<button class="btn danger" id="del" style="margin-left:auto">Delete</button>' : '') +
    '</div>';
  PH = { id: r.id || '', photos: (r.photos || []).slice(), crew: (r.crew || []).map(x => ({ ...x })) };
  KKPHOTO.mount($('#kkPhotos'), () => PH);
  KKCREW.mount(
    $('#kkCrew'),
    () => PH,
    () => {
      const d = $('#form [data-k="date"]') || $('#form [data-k="start"]');
      return String((d && d.value) || r.date || r.start || '').slice(0, 10);
    }
  );
  if ($('#card'))
    $('#card').onclick = async () => {
      const d = shareCard(t, CUR);
      d.pics = await KKPHOTO.images(PH.photos, 2);
      KKCARD.open([d], { heading: title(t, CUR), brand: brandOf(t, CUR) });
    };
  const form = $('#form');
  form.addEventListener('input', live);
  form.addEventListener('change', e => {
    if (!e.target.matches('[data-k="protocol"]')) return;
    const pr = PROTOCOLS.find(x => x.name === e.target.value);
    if (!pr) return;
    for (const k of ['method', 'precond', 'starter']) {
      const el = form.querySelector('[data-k="' + k + '"]');
      if (el && pr[k]) el.value = pr[k];
    }
    live();
  });
  form.addEventListener('change', live);
  form.addEventListener('click', e => {
    const add = e.target.closest('[data-add]');
    if (add) add.insertAdjacentHTML('beforebegin', lrow(COLS[add.dataset.add], {}));
    const del = e.target.closest('[data-del]');
    if (del) {
      del.parentElement.remove();
      live();
    }
  });
  if ($('#here'))
    $('#here').onclick = () =>
      navigator.geolocation
        ? navigator.geolocation.getCurrentPosition(
            p => {
              $('[data-k="lat"]').value = p.coords.latitude.toFixed(6);
              $('[data-k="lng"]').value = p.coords.longitude.toFixed(6);
            },
            e => toast('Location: ' + e.message),
            { enableHighAccuracy: true, timeout: 20000 }
          )
        : toast('No location on this browser');
  if ($('#pass')) $('#pass').onclick = () => openPassport(CUR);
  live();
  $('#save').onclick = async () => {
    const rec = collect(t);
    if (t === 'estate' && rec.altitude !== '') rec.altUnit = 'm';
    const miss = FIELDS[t]
      .filter(f => f[3] && f[3].req && (rec[f[0]] === '' || rec[f[0]] == null))
      .map(f => f[1]);
    if (miss.length) return toast('Fill in: ' + miss.join(', '));
    const saved = await ORIGIN.put(rec);
    toast('Saved');
    location.hash = '#edit/' + t + '/' + encodeURIComponent(saved.id);
    if (!CUR) return;
    editView(t, saved.id);
  };
  if ($('#del'))
    $('#del').onclick = async () => {
      if (!confirm('Delete this record?')) return;
      await ORIGIN.remove(CUR.id);
      location.hash = '#' + tb[1];
    };
}

// ---------- passport: what this lot's passport will hold ----------
function card(t, r) {
  const rows = {
    estate: [
      ['Place', [r.locality, r.district, r.state, r.country].filter(Boolean).join(', ')],
      ['Area', r.area ? r.area + ' ' + (r.areaUnit || 'acre') : ''],
      ['Height', r.altitude ? r.altitude + ' m' : ''],
    ],
    plot: [
      ['Variety or clone', r.clone],
      ['Trees', r.trees],
      ['Planted', r.planted],
      ['Spacing', r.spacing],
      ['Shade', r.shade],
    ],
    harvest: [
      ['Pods', r.pods],
      ['Black pod', r.blackPods],
      ['Wet beans', r.wetKg ? r.wetKg + ' kg' : ''],
      ['Pulp Brix', r.brix ? r.brix + ' °Bx' : ''],
      ['Pods kept', r.podDays ? r.podDays + ' days' : ''],
      ['People and hours', KKCREW.summary(r)],
    ],
    process: (() => {
      const s = fermentSummary(r);
      return [
        ['People and hours', KKCREW.summary(r)],
        ['Protocol', r.protocol],
        ['Method', r.method],
        ['Starter yeast', r.starter && r.starter !== 'None' ? r.starter : ''],
        ['Fruit added', r.fruit],
        ['Wet beans in', r.wetKg ? r.wetKg + ' kg' : ''],
        [
          'Pulp Brix',
          s.brixStart != null ? s.brixStart + ' °Bx' + (s.brixLast != null ? ' to ' + s.brixLast : '') : '',
        ],
        ['Pulp pH', r.ph],
        ['Fermentation', s.fermentHours ? s.fermentHours + ' h' : ''],
        ['Turns', s.turns || ''],
        ['Peak', s.peak ? s.peak + ' °C' : ''],
        ['Drying', r.dryMethod],
        ['Final moisture', s.moisture != null ? s.moisture + '%' : ''],
        ['Dry beans out', r.dryKg ? r.dryKg + ' kg' : ''],
      ];
    })(),
    green: (() => {
      const c = cutTest(r.cut),
        b = beanCount(r.per100, r.w300);
      return [
        ['Weight', r.weightKg ? r.weightKg + ' kg' : ''],
        ['Moisture', r.moisture ? r.moisture + '%' : ''],
        ['Grade', c ? c.grade + ', ' + c.ferm : ''],
        ['Fully brown', c ? c.pct.brown + '%' : ''],
        ['Slaty', c ? c.pct.slaty + '%' : ''],
        ['Designations', (r.designations || []).join(', ')],
        ['Bean count', b ? b.count + ' per 100 g' : ''],
      ];
    })(),
  }[t];
  return {
    kind: tabOf(t)[3],
    title: title(t, r),
    sub: '',
    date: fmtDate(r.date || r.start || ''),
    chips: [],
    rows: rows.filter(x => x[1] !== '' && x[1] != null).map(x => [x[0], String(x[1])]),
    notes: r.notes || '',
    loc: r.lat && r.lng ? (+r.lat).toFixed(5) + ', ' + (+r.lng).toFixed(5) : '',
    pics: KKPHOTO.sealed(r.photos),
  };
}
// Any record from the block onward can carry a passport; a lot made from a sealed run carries it on.
function chainOf(t, r) {
  if (t === 'green') return lineage(r);
  const hs =
    t === 'process'
      ? (r.harvestIds || []).map(id => byId('harvest', id)).filter(Boolean)
      : t === 'harvest'
        ? [r]
        : [];
  const plots =
    t === 'plot'
      ? [r]
      : [...new Set(hs.flatMap(h => h.plotIds || []))].map(id => byId('plot', id)).filter(Boolean);
  const estates = [...new Set(plots.map(x => x.estateId))].map(id => byId('estate', id)).filter(Boolean);
  return { p: t === 'process' ? r : null, hs, plots, estates };
}
async function openPassport(g) {
  const T0 = g.type || 'green';
  const own = g.traceRole !== 'received';
  const L = chainOf(T0, g);
  if (!g.traceLot) {
    const up = T0 === 'green' ? [L.p] : T0 === 'process' ? L.hs : [];
    const from = up.find(x => x && x.traceLot && x.traceRole !== 'received');
    if (from) {
      Object.assign(g, { traceLot: from.traceLot, traceToken: from.traceToken });
      await ORIGIN.put({ ...g });
    }
  }
  const items = [];
  const rec = (t, r, kg, geo) =>
    items.push({ kind: 'record', rtype: t, rid: r.id, card: card(t, r), kg: kg || {}, geo: geo || null });
  if (own) {
    L.estates.forEach(e => rec('estate', e));
    L.plots.forEach(p =>
      rec('plot', p, {}, Array.isArray(p.geo) && p.geo.length > 2 ? p.geo.map(x => [+x[0], +x[1]]) : null)
    );
    L.hs.forEach(h => rec('harvest', h, { cherry: +h.wetKg || null }));
    if (L.p) rec('process', L.p, { in: +L.p.wetKg || null, out: +L.p.dryKg || null });
    if (T0 === 'green') rec('green', g, { green: +g.weightKg || null });
  }
  for (const b of T0 === 'green' ? (DB.batch || []).filter(x => x.lotId === g.id) : [])
    items.push({
      kind: 'roast',
      rid: b.id,
      card: {
        kind: 'Chocolate batch',
        title: b.name || 'Batch',
        sub: '',
        date: fmtDate(b.date),
        chips: [],
        rows: [
          ['Beans in', b.beansKg ? b.beansKg + ' kg' : ''],
          ['Roast', b.roastTemp ? b.roastTemp + ' °C, ' + (b.roastMin || '') + ' min' : ''],
          ['Cocoa', b.pct && b.pct.nibs ? recipe(1, b.pct).cocoa + '%' : ''],
          ['Bars', b.bars ? b.bars + ' × ' + (b.barG || '') + ' g' : ''],
        ].filter(x => x[1]),
        notes: '',
        loc: '',
      },
      kg: { green: +b.beansKg || null },
    });
  if (own) {
    toast('Preparing photos…');
    await KKPHOTO.publish(
      [...L.estates, ...L.plots, ...L.hs, L.p, T0 === 'green' ? g : null]
        .filter(Boolean)
        .flatMap(x => x.photos || [])
    );
  }
  try {
    sessionStorage.setItem(
      'kk_trace_plan',
      JSON.stringify({
        greenId: g.id,
        rtype: T0,
        title: title(T0, g),
        role: own ? 'owner' : 'buyer',
        lot: g.traceLot || null,
        items,
      })
    );
  } catch (e) {
    return toast('Could not prepare the passport');
  }
  location.href = 'trace.html#seal';
}

function route() {
  const h = location.hash.slice(1);
  let m;
  if ((m = h.match(/^new\/(\w+)$/)) && FIELDS[m[1]]) return editView(m[1], null);
  if ((m = h.match(/^edit\/(\w+)\/(.+)$/)) && FIELDS[m[1]]) return editView(m[1], decodeURIComponent(m[2]));
  const tb = TABS.find(x => x[1] === h);
  listView(tb ? tb[0] : 'estate');
}
// Export and share from a list: one CSV of the tab, or cards (images, PDF) of every record in it.
document.addEventListener('click', e => {
  const id = e.target.id;
  if (id !== 'csv' && id !== 'cards') return;
  const tb = TABS.find(x => x[1] === location.hash.slice(1)) || TABS[0];
  const t = tb[0],
    rows = DB[t] || [];
  if (id === 'cards')
    return KKCARD.open(
      rows.map(r => shareCard(t, r)),
      { heading: tb[2], brand: (DB.estate[0] || {}).name }
    );
  const plain = FIELDS[t].filter(f =>
    ['text', 'num', 'date', 'select', 'datetime-local', 'clone', 'area', 'link'].includes(f[2])
  );
  const cols = [[r => title(t, r), 'Record']].concat(
    plain.map(f => [f[2] === 'link' ? r => title(f[3].type, byId(f[3].type, r[f[0]])) : f[0], f[1]])
  );
  if (t === 'estate' || t === 'plot') cols.push(['lat', 'Latitude'], ['lng', 'Longitude']);
  if (t === 'plot') cols.push([r => density(r), 'Trees per ha']);
  if (t === 'harvest')
    cols.push([r => (r.plotIds || []).map(x => (byId('plot', x) || {}).name).filter(Boolean), 'Blocks']);
  if (t === 'process')
    cols.push(
      [r => (r.harvestIds || []).map(x => title('harvest', byId('harvest', x))), 'Pickings'],
      [r => fermentSummary(r).fermentHours, 'Fermentation hours'],
      [r => fermentSummary(r).turns, 'Turns'],
      [r => fermentSummary(r).peak, 'Peak °C'],
      [r => fermentSummary(r).brixLast, 'Last pulp °Bx'],
      [r => fermentSummary(r).moisture, 'Last moisture %'],
      [r => fermentSummary(r).recovery, 'Dry as % of wet']
    );
  if (t === 'green')
    cols.push(
      [r => (cutTest(r.cut) || {}).grade, 'Grade'],
      [r => (cutTest(r.cut) || {}).ferm, 'Fermentation'],
      [r => (cutTest(r.cut) || {}).brown, 'Fully brown %'],
      [r => ((cutTest(r.cut) || {}).pct || {}).slaty, 'Slaty %'],
      [r => (beanCount(r.per100, r.w300) || {}).count, 'Beans per 100 g'],
      ['designations', 'Designations']
    );
  saveCsv('koko-' + tb[1], rows, cols);
});
function shareCard(t, r) {
  const c = card(t, r);
  return {
    ...c,
    chips: t === 'green' && cutTest(r.cut) ? [cutTest(r.cut).grade] : [],
    qr: t === 'green' && r.traceToken ? location.origin + '/trace.html#p/' + r.traceToken : '',
  };
}
function brandOf(t, r) {
  if (t === 'estate') return r.name;
  if (t === 'plot') return (byId('estate', r.estateId) || {}).name;
  if (t === 'green') return (lineage(r).estates[0] || {}).name;
  return (DB.estate[0] || {}).name;
}
window.addEventListener('hashchange', route);
ORIGIN.onSync(s => {
  if (s.status === 'synced' && s.changed && !/^(new|edit)/.test(location.hash.slice(1))) route();
});
route();
ORIGIN.sync().catch(() => {});
</script>
